<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Litmus — The definitive test for production AI agents</title>
    <link rel="icon" type="image/jpeg" href="/favicon.jpeg" />
    <meta name="description" content="Litmus by QualityKiosk — the evaluation, observability, and governance platform for production AI agents. Score every response against the CLAMP · PEST · GHTPWR framework, trace it live, and gate every release." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800;900&family=Inter:wght@400;450;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      :root { color-scheme: light; }
      html { scroll-behavior: smooth; }
      body {
        background: #f7f4ee;
        color: #1a1613;
        font-family: "Inter", -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        line-height: 1.55;
        font-feature-settings: "cv11", "ss01";
      }
      #root { min-height: 100vh; }
      a { color: inherit; text-decoration: none; }
      ::-webkit-scrollbar { width: 12px; height: 12px; }
      ::-webkit-scrollbar-thumb { background: #d9d0c2; border-radius: 6px; }
      ::-webkit-scrollbar-track { background: #efe9e0; }
      ::selection { background: #1a161320; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
